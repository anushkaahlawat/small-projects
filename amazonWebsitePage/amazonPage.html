<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amazon page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="amazon.css">
</head>
<body>
  <header>
    <div class="navbar">
        <div class="nav-logo border">
          <div class="logo"><img src="https://tse4.mm.bing.net/th/id/OIP.HxiVSggEZP4WgphQ8i_qVQHaEk?w=730&h=450&rs=1&pid=ImgDetMain&o=7&rm=3" alt="" width="80px"></div>
        </div>
        <div class="navAddress border">
          <p id="address">Deliver  to</p>
          <div class="addressIcon">
          <i class="fa-solid fa-location-dot"></i>
            <p id="india">India</p>
          </div>
        </div>
        <div class="navSearch ">
          <select class="search-select">
            <option>All</option>
            <option>Sports</option>
            <option>Watches</option>
            <option>Shirts</option>
            <option>Jeans</option>
            <option>Perfumes</option>
            <option>Electronics</option>
            <option>Mobiles</option>
            <option>Books</option>
          </select>
          <input id="cloth" placeholder="Search Amazon.in" class="input-search">
          <div class="search-icon">
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
        </div>
        <div class ="language">
          <div class = "flag"></div>
          <div class = "lang">
            <select class = "search-sec">
              <option>ENG</option>
              <option>HINDI</option>
              <option>ITALIAN</option>
              <option>GERMAN</option>
              <option>espanol-ES</option>
              <option>Deutsch-DE</option>   
              <option>KOREAN</option>
            </select>
          </div>
        </div>
        <div class="nav-signin border">
          <p><span>Hello,sign in</span></p>
          <p class="nav-second">Account & lists</p>
        </div>
        <div class="nav-signin border">
          <p><span id="return">Returns</span></p>
          <p class="nav-third">& Orders</p>
        </div>
        <div class="nav-cart border">
          <i class="fa-solid fa-cart-shopping"></i>
          cart
        </div>
    </div> 
    <div class="strip">
      <div class="icon-all">
        <i class="fa-solid fa-bars"></i>
        all
        <div class = "strip-opt">
          <p>today's Deal</p>
          <p>Customer Serivice</p>
          <p>Registry</p>
          <p>Gift card</p>
          <p>Sell</p>
        </div>
        <div class="strip-deals">
          Shop Deals in Electronics
        </div>
      </div>
    </div>

  </header>
    
</body>
</html>
