<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CodeX Pro</title>

<style>
:root {
    --bg: #0a0f1c;
    --text: #ffffff;
    --accent: #00f7ff;
}

body.light {
    --bg: #f5f5f5;
    --text: #111;
}

body {
    margin: 0;
    font-family: 'Courier New', monospace;
    background: var(--bg);
    color: var(--text);
    transition: 0.3s;
}

/* NAV */
nav {
    display: flex;
    justify-content: space-between;
    padding: 15px;
    background: rgba(0,0,0,0.6);
}

nav a {
    margin-left: 15px;
    cursor: pointer;
}

/* HERO */
.hero {
    text-align: center;
    margin-top: 80px;
}

.typing {
    font-size: 40px;
    color: var(--accent);

}

/* BUTTON */
.btn {
    padding: 20px 40px;
    border: 2px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    font-size: large;
}
.btn:hover{
   background-color:aqua;
   color: white;
   border-radius: 5%;
   border: 1px solid cyan ;
}

/* SECTIONS */
.section {
    display: none;
    padding: 50px;
}

.active {
    display: block;
}

/* TABS */
.tabs button {
    margin: 5px;
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

/* EDITOR */
.editor {
    display: flex;
    gap: 10px;
}

textarea {
    width: 50%;
    height: 200px;
    background: #111;
    color: #0f0;
}

iframe {
    width: 50%;
    background: white;
}

/* LOGIN */
.login-popup {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    display: none;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: #111;
    padding: 20px;
}

canvas {
    position: fixed;
    top: 0;
    z-index: -1;
}
</style>
</head>

<body>

<!-- PARTICLE BACKGROUND -->
<canvas id="bg"></canvas>

<nav>
    <h2>CodeX</h2>
    <div>
        <a onclick="showSection('home')">Home</a>
        <a onclick="showSection('learn')">Learn</a>
        <a onclick="showSection('projects')">Projects</a>
        <a onclick="openLogin()">Login</a>
        <a onclick="toggleTheme()">Theme</a>
    </div>
</nav>

<!-- HOME -->
<div id="home" class="section active">
    <div class="hero">
        <h1 class="typing" id="typing"></h1>
        <button class="btn" onclick="showSection('learn')">Start</button>
    </div>
</div>

<!-- LEARN -->
<div id="learn" class="section">
    <h1>Learn</h1>

    <div class="tabs">
        <button onclick="openTab('html')">HTML</button>
        <button onclick="openTab('css')">CSS</button>
        <button onclick="openTab('js')">JS</button>
    </div>

    <div id="html" class="tab-content active">HTML = Structure</div>
    <div id="css" class="tab-content">CSS = Design</div>
    <div id="js" class="tab-content">JS = Logic</div>

    <h2>Try Code:</h2>
    <div class="editor">
        <textarea id="code">&lt;h1&gt;Hello&lt;/h1&gt;</textarea>
        <iframe id="preview"></iframe>
    </div>
    <button onclick="runCode()">Run</button>
</div>

<!-- PROJECTS -->
<div id="projects" class="section">
    <h1>Projects</h1>
    <p>Calculator</p>
</div>

<!-- LOGIN -->
<div class="login-popup" id="loginPopup">
    <div class="login-box">
        <h2>Login</h2>
        <input id="user" placeholder="Username"><br><br>
        <input id="pass" type="password" placeholder="Password"><br><br>
        <button onclick="login()">Login</button><br><br>
        <button onclick="closeLogin()">Close</button>
    </div>
</div>
<div class = "footer">
    <div>
        
    </div>
</div>

<script>
/* SECTION SWITCH */
function showSection(id){
    document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

/* TYPING EFFECT */
let text = "Welcome to CodeX 🚀";
let i = 0;
function type(){
    if(i < text.length){
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(type, 50);
    }
}
type();

/* TABS */
function openTab(id){
    document.querySelectorAll(".tab-content").forEach(t=>t.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

/* CODE RUNNER */
function runCode(){
    let code = document.getElementById("code").value;
    document.getElementById("preview").srcdoc = code;
}

/* LOGIN */
function openLogin(){
    document.getElementById("loginPopup").style.display="flex";
}
function closeLogin(){
    document.getElementById("loginPopup").style.display="none";
}
function login(){
    let u = document.getElementById("user").value;
    let p = document.getElementById("pass").value;
    if(u && p){
        alert("Login Successful");
    } else {
        alert("Enter details");
    }
}

/* THEME */
function toggleTheme(){
    document.body.classList.toggle("light");
}

/* PARTICLES */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
for(let i=0;i<100;i++){
    particles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*2
    });
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle="#00f7ff";
        ctx.fill();
        p.y -= 0.5;
        if(p.y<0) p.y=canvas.height;
    });
    requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
